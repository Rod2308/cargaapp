name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Copiando as suas variáveis de ambiente do Supabase (para o app conseguir conectar no banco)
      - name: Create .env file
        run: |
          echo 'SUPABASE_PROJECT_ID="isqqabqvdsdhyrznxdkx"' > .env
          echo 'SUPABASE_PUBLISHABLE_KEY="sb_publishable_7DaaxbJVnw2iTqm7E2asnw_aCM4Wwo_"' >> .env
          echo 'SUPABASE_URL="https://isqqabqvdsdhyrznxdkx.supabase.co"' >> .env
          echo 'VITE_SUPABASE_PROJECT_ID="isqqabqvdsdhyrznxdkx"' >> .env
          echo 'VITE_SUPABASE_PUBLISHABLE_KEY="sb_publishable_7DaaxbJVnw2iTqm7E2asnw_aCM4Wwo_"' >> .env
          echo 'VITE_SUPABASE_URL="https://isqqabqvdsdhyrznxdkx.supabase.co"' >> .env

      - name: Install dependencies
        run: npm install

      # CORREÇÃO AQUI: Agora ele vai compilar o seu projeto de verdade!
      - name: Build the App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargaapp-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
